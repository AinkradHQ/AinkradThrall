name: AinkradThrall

options:
  bundleIdPrefix: com.ainkrad
  deploymentTarget: { macOS: "14.0" }
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    EAGER_LINKING: NO

packages:
  AinkradAppKit:
    url: https://github.com/AinkradHQ/AinkradAppKit
    # MUST stay AT OR BEHIND the revision the HOST embeds — currently the
    # host's own pin (Ainkrad/project.yml). The host embeds the single dynamic
    # copy of the SDK; a plugin built against a NEWER revision links symbols
    # that copy does not define and dies at `Bundle.load()` with no diagnostic,
    # which surfaces to the user as "the app has no apps".
    #
    # AppKit `main` is ahead of this. Do not "update" it without moving the
    # host first.
    # c315110: generation 11 -- Basic Mode. NOT releasable until an installed
    # host is generation 11.
    # 43868c9: AinkradSurfaceSettings -- the shared Open as / Open in rows.
    # fb4be6d: Glass Native E1–E2 (#96–#106): kit components draw Apple's own controls and Liquid Glass when
    #   skin.usesNativeGlass. AppKitUI ABI: additions only. Host pins the same revision (#282).
    # aa3fc95: AinkradMenuButton keeps a custom label under Glass (#107).
    # bdf3b0d: Grimoire E1 — AinkradMarkdownText, AinkradDiffReview, AinkradDecisionBar, AinkradComposer (#108–#110).
    # 41cd9d9: markdown pipe tables and block quotes in AinkradMarkdownText (#111).
    # 51655c2: AinkradMenuButton.kitMenuUnderGlass() opt-in (#112, Forge FD20).
    # 966326c: kit parity batches 1+2 (#113, #114) for the Forge/Grimoire mockups; additive, abi-check clean.
    # a352acd: kit parity batches 3+4 (#115, #116) for the Forge/Grimoire mockups; additive, abi-check clean.
    # dbc2b5e: kit parity batch 5 (#117) for the Forge mockups; additive, abi-check clean.
    # 20fb3db: kit parity batch 6 (#118) for the Forge mockups; additive, abi-check clean.
    revision: 20fb3db9f278b3e73f195c3bfb5c321084db3053

targets:
  # All logic lives here, statically linked into the bundle, so it is reachable
  # from a test target. AinkradAppKit is the one exception to static linking.
  ThrallFeature:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/ThrallFeature
      # The status and config files the plugin shares with thrall-engine.
      - path: Sources/ThrallEngine/Core/ThrallEngineShared.swift
    dependencies:
      - package: AinkradAppKit
        embed: false

  ThrallPlugin:
    type: bundle
    platform: macOS
    sources:
      - path: Sources/ThrallPlugin
    dependencies:
      - target: ThrallFeature
      - package: AinkradAppKit
        embed: false
      # thrall-engine ships inside the bundle at Contents/Helpers; the
      # installer copies it to ~/.thrall/bin, a path launchd can keep using
      # across plugin updates.
      - target: ThrallEngine
        link: false
        embed: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ainkrad.plugin.thrall
        PRODUCT_NAME: ThrallPlugin
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/ThrallPlugin/Info.plist
        MACH_O_TYPE: mh_bundle
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        OTHER_LDFLAGS: ["-lThrallFeature"]
    postBuildScripts:
      # Derive AinkradAPIVersion from the linked SDK rather than trusting the
      # hand-typed value in Info.plist — see the script's own header.
      - script: "\"$SRCROOT/scripts/stamp-api-version.sh\""
        name: Stamp AinkradAPIVersion
        # The plist is an INPUT, not an output: declaring it orders this phase
        # after the task that copies it into the bundle. Without it the script
        # races that copy and finds nothing.
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        # No outputs, so keep it running every build: the linked SDK revision
        # can change generation without any source file changing.
        basedOnDependencyAnalysis: false

  ThrallFeatureTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/ThrallFeatureTests
    dependencies:
      - target: ThrallFeature
      - package: AinkradAppKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  # The helper that owns the Linux VM behind Thrall's own engine. It runs
  # outside the host process (launchd starts it), so it links no AinkradAppKit.
  # Signed ad hoc even in Debug: Virtualization.framework refuses to create a
  # VM in a process without the entitlement, and an unsigned binary has none.
  ThrallEngine:
    type: tool
    platform: macOS
    sources:
      - path: Sources/ThrallEngine
    settings:
      base:
        PRODUCT_NAME: thrall-engine
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_ENTITLEMENTS: config/ThrallEngine.entitlements

  # Compiles the helper's Core sources directly: an executable target cannot
  # be imported, and Core is the part with logic worth testing.
  ThrallEngineTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/ThrallEngineTests
      - path: Sources/ThrallEngine/Core
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  ThrallPlugin:
    build:
      targets:
        ThrallPlugin: all
        ThrallEngine: all
        ThrallFeatureTests: [test]
        ThrallEngineTests: [test]
    test:
      config: Debug
      targets:
        - ThrallFeatureTests
        - ThrallEngineTests
